<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Message</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        text-align: center;
    }

    .page {
        display: none;
        padding: 50px;
        animation: fadeIn 1s ease;
    }

    .active {
        display: block;
    }

    input, button {
        padding: 12px;
        font-size: 16px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
    }

    button {
        background: #38bdf8;
        color: #000;
        cursor: pointer;
    }

    button:hover {
        background: #0ea5e9;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    /* Full screen message */
    #page2 {
        display: none;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }

    #page2.active {
        display: flex;
    }

    #message {
        font-size: 28px;
        max-width: 90%;
        line-height: 1.5;
    }

    #credit {
        margin-top: 20px;
        opacity: 0;
        transition: opacity 1s ease;
        color: #38bdf8;
        font-weight: bold;
    }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h1>Enter a Number</h1>
    <p>Type reg number</p>

    <input type="number" id="numberInput" placeholder="Enter number">
    <br>
    <button onclick="goToPage()">Submit</button>
</div>

<!-- PAGE 2 -->
<div id="page2">
    <h1 id="message"></h1>
    <p id="credit">Edited by Rowen</p>
</div>

<script>
function goToPage() {
    let number = document.getElementById("numberInput").value;

    if (number == 2) {
        document.getElementById("page1").classList.remove("active");
        document.getElementById("page2").classList.add("active");

        typeMessage();
    } else {
        alert("Enter 2 to continue 😏");
    }
}

function typeMessage() {
    let text = "I just wanted you to know that Jesus loves you 🌚🤭";
    let i = 0;

    let speed = 50;

    let interval = setInterval(() => {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;

        if (i >= text.length) {
            clearInterval(interval);

            setTimeout(() => {
                document.getElementById("credit").style.opacity = 1;
            }, 800);
        }
    }, speed);
}
</script>

</body>
</html>
