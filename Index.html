html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Single Page</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
        text-align: center;
    }

    .page {
        display: none;
        padding: 50px;
        animation: fadeIn 1s ease;
    }

    .active {
        display: block;
    }

    input, button {
        padding: 10px;
        font-size: 16px;
        margin-top: 10px;
    }

    /* Fade animation */
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    /* Noble animation */
    .noble {
        font-size: 40px;
        color: #38bdf8;
        animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 5px #38bdf8;
        }
        to {
            text-shadow: 0 0 20px #38bdf8, 0 0 40px #38bdf8;
        }
    }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h1>Enter a Number</h1>
    <p>Type reg number</p>

    <input type="number" id="numberInput" placeholder="Enter number">
    <br>
    <button onclick="goToPage()">Submit</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h1>Welcome to Page 2</h1>
    <p>Produced by</p>
    <div class="noble">Noble</div>

    <br><br>
    <button onclick="goBack()">Go Back</button>
</div>

<script>
    function goToPage() {
        let number = document.getElementById("numberInput").value;

        if (number == 1) {
            alert("You stayed on Page 1");
        } 
        else if (number == 2) {
            document.getElementById("page1").classList.remove("active");
            document.getElementById("page2").classList.add("active");
        } 
        else {
            alert("Invalid number! Try 1 or 2.");
        }
    }

    function goBack() {
        document.getElementById("page2").classList.remove("active");
        document.getElementById("page1").classList.add("active");
    }
</script>

</body>
</html>
